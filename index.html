<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daniel — Software Engineer. Studying physics, math, and CS, building toward the craft full-time." />
  <meta name="color-scheme" content="light dark" />
  <title>Daniel — Software Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ===== shared ===== */
    html { scroll-behavior: smooth; background: #fff8e7; }
    @media (prefers-color-scheme: dark) { html { color-scheme: dark; background: #000000; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    #site { min-height: 100vh; isolation: isolate; }

    /* ===== LIGHT MODE: comic (original CSS, scoped) ===== */
#site[data-site="comic"] {
      --page: #fff8e7;
      --panel: #f4f1e0;
      --ink: #0d0d0d;
      --ink-soft: #3a3630;
      --red: #e8432f;
      --yellow: #ffc93c;
      --blue: #2f6fb0;
      --blue-dark: #204d80;
    }
#site[data-site="comic"], #site[data-site="comic"] * { box-sizing: border-box; }
#site[data-site="comic"] {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
#site[data-site="comic"] a { color: inherit; }
#site[data-site="comic"] .comic {
      font-family: "Bangers", cursive;
      letter-spacing: 0.03em;
    }
#site[data-site="comic"] .halftone {
      background-image: radial-gradient(var(--ink) 1px, transparent 1.4px);
      background-size: 9px 9px;
      opacity: .14;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
#site[data-site="comic"] .container {
      width: min(760px, calc(100% - 32px));
      margin-inline: auto;
    }
#site[data-site="comic"] header {
      padding: 24px 0 0;
    }
#site[data-site="comic"] .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
    }
#site[data-site="comic"] .brand {
      font-family: "Bangers", cursive;
      font-size: 1.7rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      transform: rotate(-2deg);
      display: inline-block;
    }
#site[data-site="comic"] .brand .dot { color: var(--red); }
#site[data-site="comic"] .nav-links {
      display: flex;
      gap: 10px;
    }
#site[data-site="comic"] .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: .85rem;
      padding: 7px 14px;
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-1deg);
      transition: transform .12s ease, box-shadow .12s ease;
    }
#site[data-site="comic"] .nav-links a:nth-child(2) { transform: rotate(1deg); }
#site[data-site="comic"] .nav-links a:nth-child(3) { transform: rotate(-1deg); }
#site[data-site="comic"] .nav-links a:hover, #site[data-site="comic"] .nav-links a:focus-visible {
      transform: translate(2px, 2px) rotate(0deg);
      box-shadow: 1px 1px 0 var(--ink);
      outline: none;
    }
#site[data-site="comic"] .hero {
      margin: 18px 0 40px;
      position: relative;
      border: 5px solid var(--ink);
      background: var(--blue);
      padding: 52px 32px 44px;
      overflow: hidden;
      transform: rotate(-0.6deg);
      box-shadow: 8px 8px 0 var(--ink);
    }
#site[data-site="comic"] .hero-inner { position: relative; z-index: 1; }
#site[data-site="comic"] .kicker {
      display: inline-block;
      font-family: "Bangers", cursive;
      font-size: 1.05rem;
      letter-spacing: .05em;
      background: var(--yellow);
      color: var(--ink);
      border: 3px solid var(--ink);
      padding: 4px 14px;
      transform: rotate(-3deg);
      margin: 0 0 20px;
    }
#site[data-site="comic"] h1 {
      font-family: "Bangers", cursive;
      font-size: clamp(3rem, 11vw, 5.2rem);
      line-height: 0.95;
      margin: 0 0 6px;
      color: #fff8e7;
      -webkit-text-stroke: 2.5px var(--ink);
      text-shadow: 4px 4px 0 var(--ink);
      letter-spacing: 0.02em;
    }
#site[data-site="comic"] .role-shout {
      font-family: "Bangers", cursive;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--yellow);
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 3px 3px 0 var(--ink);
      margin: 0 0 22px;
      transform: rotate(-1deg);
      display: inline-block;
    }
#site[data-site="comic"] .speech-bubble {
      position: relative;
      background: #fff8e7;
      border: 4px solid var(--ink);
      border-radius: 22px;
      padding: 20px 24px;
      max-width: 52ch;
      font-size: 1.02rem;
      color: var(--ink-soft);
      margin: 0 0 28px;
    }
#site[data-site="comic"] .speech-bubble strong { color: var(--ink); }
#site[data-site="comic"] .speech-bubble::after {
      content: "";
      position: absolute;
      left: 38px;
      bottom: -22px;
      width: 0;
      height: 0;
      border: 14px solid transparent;
      border-top-color: var(--ink);
      border-bottom: 0;
    }
#site[data-site="comic"] .speech-bubble::before {
      content: "";
      position: absolute;
      left: 42px;
      bottom: -16px;
      width: 0;
      height: 0;
      border: 10px solid transparent;
      border-top-color: #fff8e7;
      border-bottom: 0;
      z-index: 1;
    }
#site[data-site="comic"] .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 34px;
    }
#site[data-site="comic"] .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "Bangers", cursive;
      font-size: 1.1rem;
      letter-spacing: .03em;
      padding: 12px 26px;
      text-decoration: none;
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform .12s ease, box-shadow .12s ease;
    }
#site[data-site="comic"] .btn:hover, #site[data-site="comic"] .btn:focus-visible {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
      outline: none;
    }
#site[data-site="comic"] .btn.primary { background: var(--red); color: #fff8e7; }
#site[data-site="comic"] .btn.ghost { background: var(--yellow); color: var(--ink); }
#site[data-site="comic"] section { padding: 44px 0; }
#site[data-site="comic"] .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 30px;
    }
#site[data-site="comic"] .issue-tag {
      font-family: "Bangers", cursive;
      font-size: .95rem;
      background: var(--ink);
      color: var(--page);
      padding: 5px 12px;
      transform: rotate(-2deg);
      white-space: nowrap;
    }
#site[data-site="comic"] h2 {
      font-family: "Bangers", cursive;
      font-size: 2rem;
      letter-spacing: .02em;
      margin: 0;
    }
#site[data-site="comic"] #about .panel {
      position: relative;
      border: 4px solid var(--ink);
      background: var(--panel);
      padding: 28px 26px;
      box-shadow: 6px 6px 0 var(--ink);
    }
#site[data-site="comic"] .about-text {
      position: relative;
      z-index: 1;
      max-width: 62ch;
      font-size: 1.02rem;
      color: var(--ink-soft);
    }
#site[data-site="comic"] .about-text strong { color: var(--ink); font-weight: 700; }
#site[data-site="comic"] .tags {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
#site[data-site="comic"] .tag {
      font-weight: 700;
      font-size: .82rem;
      padding: 6px 13px;
      border: 2.5px solid var(--ink);
      background: var(--yellow);
      transform: rotate(-1deg);
    }
#site[data-site="comic"] .tag:nth-child(even) { transform: rotate(1deg); background: #fff; }
#site[data-site="comic"] .tag.pow { background: var(--red); color: #fff8e7; }
#site[data-site="comic"] .project-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
#site[data-site="comic"] .project {
      position: relative;
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 18px;
      align-items: center;
      border: 4px solid var(--ink);
      background: var(--panel);
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform .12s ease, box-shadow .12s ease;
    }
#site[data-site="comic"] .project:nth-child(1) { transform: rotate(-0.5deg); }
#site[data-site="comic"] .project:nth-child(2) { transform: rotate(0.5deg); }
#site[data-site="comic"] .project:hover {
      transform: translate(3px, 3px) rotate(0deg);
      box-shadow: 3px 3px 0 var(--ink);
    }
#site[data-site="comic"] .project-badge {
      font-family: "Bangers", cursive;
      font-size: 1.5rem;
      color: #fff8e7;
      background: var(--blue);
      border: 3px solid var(--ink);
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-4deg);
      position: relative;
      z-index: 1;
    }
#site[data-site="comic"] .project.is-live .project-badge { background: var(--red); }
#site[data-site="comic"] .project h3 {
      margin: 0 0 6px;
      font-family: "Bangers", cursive;
      font-size: 1.25rem;
      letter-spacing: .01em;
      position: relative;
      z-index: 1;
    }
#site[data-site="comic"] .project p {
      margin: 0;
      color: var(--ink-soft);
      font-size: .95rem;
      max-width: 42ch;
      position: relative;
      z-index: 1;
    }
#site[data-site="comic"] .project-meta {
      font-weight: 800;
      font-size: .78rem;
      color: var(--ink);
      background: var(--yellow);
      border: 2px solid var(--ink);
      padding: 5px 10px;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }
#site[data-site="comic"] .contact-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
#site[data-site="comic"] .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border: 4px solid var(--ink);
      background: var(--yellow);
      text-decoration: none;
      color: var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform .12s ease, box-shadow .12s ease;
    }
#site[data-site="comic"] .contact-row:nth-child(1) { transform: rotate(-0.7deg); }
#site[data-site="comic"] .contact-row:nth-child(2) { transform: rotate(0.7deg); background: #fff; }
#site[data-site="comic"] .contact-row:hover {
      transform: translate(3px, 3px) rotate(0deg);
      box-shadow: 3px 3px 0 var(--ink);
    }
#site[data-site="comic"] .contact-row .label {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
    }
#site[data-site="comic"] .contact-row .glyph {
      font-family: "Bangers", cursive;
      font-size: 1.3rem;
      background: var(--ink);
      color: var(--page);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
#site[data-site="comic"] .contact-row .value {
      font-weight: 600;
      font-size: .9rem;
    }
#site[data-site="comic"] footer {
      padding: 40px 0 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
#site[data-site="comic"] footer .stamp {
      font-family: "Bangers", cursive;
      font-size: 1rem;
      background: var(--red);
      color: #fff8e7;
      padding: 6px 14px;
      border: 3px solid var(--ink);
      transform: rotate(-2deg);
    }
#site[data-site="comic"] footer .fine-print {
      font-size: .82rem;
      color: var(--ink-soft);
      font-weight: 500;
    }
#site[data-site="comic"] :focus-visible {
      outline: 3px solid var(--blue-dark);
      outline-offset: 3px;
    }
@media (max-width: 600px) {
#site[data-site="comic"] .hero { padding: 40px 20px 34px; }
#site[data-site="comic"] .project { grid-template-columns: 56px 1fr; }
#site[data-site="comic"] .project-meta { grid-column: 2; justify-self: start; margin-top: 4px; }
#site[data-site="comic"] .project-badge { width: 46px; height: 46px; font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) {
#site[data-site="comic"], #site[data-site="comic"] *, #site[data-site="comic"] *::before, #site[data-site="comic"] *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
}

    /* ===== DARK MODE: terminal (original CSS + its dark variables, scoped) ===== */
#site[data-site="terminal"] {
      color-scheme: dark;
      --paper: #000000;
      --surface: #1b1b1b;
      --ink: #f2f1ec;
      --ink-soft: #a9a69c;
      --line: #404040;
      --accent: #7c8fff;
      --accent-soft: #23264a;
      --mint: #2fd9ae;
      --mint-soft: #123531;
    }
#site[data-site="terminal"], #site[data-site="terminal"] * { box-sizing: border-box; }
#site[data-site="terminal"] {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }
#site[data-site="terminal"] a { color: inherit; }
#site[data-site="terminal"] img { max-width: 100%; }
#site[data-site="terminal"] .mono {
      font-family: "JetBrains Mono", monospace;
    }
#site[data-site="terminal"] .container {
      width: min(760px, calc(100% - 40px));
      margin-inline: auto;
    }
#site[data-site="terminal"] .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: .35;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
      transition: opacity .25s ease;
    }
#site[data-site="terminal"] .grid-bg { opacity: .18; }
#site[data-site="terminal"] header {
      padding: 28px 0 0;
    }
#site[data-site="terminal"] .nav {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
#site[data-site="terminal"] .brand {
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 1rem;
    }
#site[data-site="terminal"] .brand .dot { color: var(--accent); }
#site[data-site="terminal"] .nav-links {
      display: flex;
      gap: 22px;
      font-family: "JetBrains Mono", monospace;
      font-size: .85rem;
    }
#site[data-site="terminal"] .nav-links a {
      text-decoration: none;
      color: var(--ink-soft);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
    }
#site[data-site="terminal"] .nav-links a:hover, #site[data-site="terminal"] .nav-links a:focus-visible {
      color: var(--ink);
      border-bottom-color: var(--accent);
      outline: none;
    }
#site[data-site="terminal"] .hero {
      padding: 64px 0 56px;
    }
#site[data-site="terminal"] .prompt-line {
      font-family: "JetBrains Mono", monospace;
      font-size: .92rem;
      color: var(--mint);
      margin: 0 0 14px;
    }
#site[data-site="terminal"] .prompt-line .caret {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: var(--ink);
      vertical-align: -2px;
      margin-left: 4px;
      animation: blink 1.1s step-end infinite;
    }
@keyframes blink {
      50% { opacity: 0; }
    }
#site[data-site="terminal"] h1 {
      font-family: "JetBrains Mono", monospace;
      font-weight: 800;
      font-size: clamp(2.1rem, 6vw, 3.1rem);
      line-height: 1.15;
      margin: 0 0 20px;
      max-width: 15ch;
    }
#site[data-site="terminal"] .hero-lede {
      max-width: 54ch;
      color: var(--ink-soft);
      font-size: 1.05rem;
      margin: 0 0 30px;
    }
#site[data-site="terminal"] .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
#site[data-site="terminal"] .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-weight: 600;
      font-size: .88rem;
      padding: 12px 18px;
      border-radius: 4px;
      text-decoration: none;
      border: 1px solid transparent;
    }
#site[data-site="terminal"] .btn.primary {
      background: var(--ink);
      color: var(--paper);
    }
#site[data-site="terminal"] .btn.primary:hover { background: var(--accent); }
#site[data-site="terminal"] .btn.ghost {
      border-color: var(--line);
      color: var(--ink);
    }
#site[data-site="terminal"] .btn.ghost:hover { border-color: var(--ink); }
#site[data-site="terminal"] section { padding: 52px 0; }
#site[data-site="terminal"] .section-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: .82rem;
      color: var(--accent);
      margin: 0 0 8px;
    }
#site[data-site="terminal"] .section-tag::before { content: "// "; color: var(--line); }
#site[data-site="terminal"] h2 {
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 1.5rem;
      margin: 0 0 28px;
    }
#site[data-site="terminal"] #about { border-top: 1px solid var(--line); }
#site[data-site="terminal"] .about-text {
      max-width: 62ch;
      font-size: 1.02rem;

    }
#site[data-site="terminal"] .about-text strong { color: var(--ink); font-weight: 600; }
#site[data-site="terminal"] .tags {
      display: flex;

      margin-top: 24px;
    }
#site[data-site="terminal"] .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: .78rem;
      padding: 6px 11px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);

#site[data-site="terminal"] .tag.mint { background: var(--mint-soft); color: var(--mint); }
#site[data-site="terminal"] #projects { border-top: 1px solid var(--line); }
#site[data-site="terminal"] .project-list {
      display: flex;
      flex-direction: column;
    }
#site[data-site="terminal"] .project {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
    }
#site[data-site="terminal"] .project:first-child { padding-top: 0; }
#site[data-site="terminal"] .project-status {
      font-family: "JetBrains Mono", monospace;
      font-size: .95rem;
      color: var(--line);
      padding-top: 3px;
    }
#site[data-site="terminal"] .project.is-live .project-status { color: var(--mint); }
#site[data-site="terminal"] .project.in-progress .project-status { color: var(--accent); }
#site[data-site="terminal"] .project h3 {
      margin: 0 0 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 1.05rem;
      font-weight: 600;
    }
#site[data-site="terminal"] .project p {
      margin: 0;
      color: var(--ink-soft);
      font-size: .95rem;
      max-width: 48ch;
    }
#site[data-site="terminal"] .project-meta {
      font-family: "JetBrains Mono", monospace;
      font-size: .78rem;
      color: var(--ink-soft);
      white-space: nowrap;
      padding-top: 4px;
    }
#site[data-site="terminal"] .project:hover h3 { color: var(--accent); }
#site[data-site="terminal"] #contact { border-top: 1px solid var(--line); }
#site[data-site="terminal"] .contact-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
#site[data-site="terminal"] .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
    }
#site[data-site="terminal"] .contact-row:hover { background: var(--surface); }
#site[data-site="terminal"] .contact-row .label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
#site[data-site="terminal"] .contact-row .glyph {
      font-family: "JetBrains Mono", monospace;
      color: var(--accent);
      width: 20px;
    }
#site[data-site="terminal"] .contact-row .value {
      font-family: "JetBrains Mono", monospace;
      color: var(--ink-soft);
      font-size: .88rem;
    }
#site[data-site="terminal"] footer {
      padding: 40px 0 50px;
      border-top: 1px solid var(--line);
      font-family: "JetBrains Mono", monospace;
      font-size: .8rem;
      color: var(--ink-soft);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

  <script>
    // Light mode -> comic design, dark mode -> terminal design, driven by the device/browser setting.
    // Only one design is in the DOM at a time, so section ids stay unique.
    (function () {
      var mount = document.getElementById('site');
      var mql = window.matchMedia('(prefers-color-scheme: dark)');

      function render() {
        var name = mql.matches ? 'terminal' : 'comic';
        if (mount.getAttribute('data-site') === name) return;
        var tpl = document.getElementById('tpl-' + name);
        mount.setAttribute('data-site', name);
        mount.replaceChildren(tpl.content.cloneNode(true));
      }

      render();
      if (location.hash) {
        var el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView();
      }

      if (mql.addEventListener) mql.addEventListener('change', render);
      else if (mql.addListener) mql.addListener(render);
    })();
  </script>
